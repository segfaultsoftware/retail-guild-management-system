name: Build Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.1.0-rc.1)
        required: true
        type: string
      branch:
        description: Release line branch (for example, release/0.1)
        required: true
        type: string
      commit:
        description: Full 40-character candidate commit SHA at the release branch tip
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.branch }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - name: Validate candidate request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'
          branch_pattern='^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          commit_pattern='^[0-9a-fA-F]{40}$'

          if [[ ! "$RELEASE_VERSION" =~ $version_pattern ]]; then
            echo "Version must be X.Y.Z or X.Y.Z-rc.N." >&2
            exit 1
          fi
          expected_branch="release/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          [[ "$RELEASE_BRANCH" =~ $branch_pattern ]] || {
            echo "Branch must be release/X.Y with no leading zeroes." >&2
            exit 1
          }
          [[ "$RELEASE_BRANCH" == "$expected_branch" ]] || {
            echo "Version $RELEASE_VERSION must be built from $expected_branch, not $RELEASE_BRANCH." >&2
            exit 1
          }
          [[ "$CANDIDATE_COMMIT" =~ $commit_pattern ]] || {
            echo "Commit must be a full 40-character SHA." >&2
            exit 1
          }
          [[ "$WORKFLOW_REF_NAME" == "main" ]] || {
            echo "Build Release Candidate must be dispatched from main." >&2
            exit 1
          }

          actual_commit="$(git rev-parse HEAD)"
          [[ "${actual_commit,,}" == "${CANDIDATE_COMMIT,,}" ]] || {
            echo "Checked-out commit does not match the requested commit." >&2
            exit 1
          }

          git fetch --no-tags origin \
            "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          branch_commit="$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH^{commit}")"
          [[ "${actual_commit,,}" == "${branch_commit,,}" ]] || {
            echo "Candidate commit is not the current origin/$RELEASE_BRANCH commit." >&2
            exit 1
          }

          manifest_version="$(sed -n 's/^## Version:[[:space:]]*\([^[:space:]]\+\)[[:space:]]*$/\1/p' RGMS.toc)"
          [[ "$manifest_version" == "$RELEASE_VERSION" ]] || {
            echo "RGMS.toc version '$manifest_version' does not match '$RELEASE_VERSION'." >&2
            exit 1
          }

          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi

      - name: Validate release changelog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $changelog = Get-Content -Raw CHANGELOG.md
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match(
            $changelog,
            "(?ms)^## (?:\[${escapedVersion}\]|${escapedVersion})(?:[ \t]+[^\r\n]*)?\r?\n(.*?)(?=^## |\z)"
          )
          if (-not $match.Success -and $version.Contains("-")) {
            $match = [regex]::Match(
              $changelog,
              '(?ms)^## (?:\[Unreleased\]|Unreleased)(?:[ \t]+[^\r\n]*)?\r?\n(.*?)(?=^## |\z)'
            )
          }
          if (-not $match.Success) {
            throw "CHANGELOG.md has no section for $version."
          }

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Build canonical candidate package
        id: package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .release
          pwsh -NoProfile -File ./scripts/build-release.ps1 \
            -Version "$RELEASE_VERSION" \
            -LuaCommand lua5.1 | tee .release/build.log

          artifact_name="RGMS-$RELEASE_VERSION.zip"
          artifact=".release/$artifact_name"
          checksum="$(sha256sum "$artifact" | awk '{ print tolower($1) }')"
          test_result="$(grep -E '^[0-9]+ tests: [0-9]+ passed, 0 failed$' .release/build.log | tail -n 1)"
          [[ -n "$test_result" ]] || {
            echo "Could not read the passing test count from the release build." >&2
            exit 1
          }

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "test_result=$test_result" >> "$GITHUB_OUTPUT"

      - name: Populate automated QA evidence
        id: qa_record
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          PACKAGE_CHECKSUM: ${{ steps.package.outputs.checksum }}
          TEST_RESULT: ${{ steps.package.outputs.test_result }}
        run: |
          set -euo pipefail

          qa_records=()
          while IFS= read -r -d '' path; do
            if grep -Fqx -- "- Release candidate: $RELEASE_VERSION" "$path"; then
              qa_records+=("$path")
            fi
          done < <(find docs/qa -maxdepth 1 -type f -name '*.md' -print0)

          [[ "${#qa_records[@]}" -eq 1 ]] || {
            echo "Expected exactly one QA record for $RELEASE_VERSION; found ${#qa_records[@]}." >&2
            exit 1
          }

          qa_record="${qa_records[0]}"
          awk \
            -v candidate_commit="${CANDIDATE_COMMIT,,}" \
            -v release_branch="$RELEASE_BRANCH" \
            -v candidate_run="$GITHUB_RUN_ID" \
            -v test_result="$TEST_RESULT" \
            -v package_checksum="$PACKAGE_CHECKSUM" \
            -v evidence_location="$qa_record" '
              BEGIN {
                candidate_commit_count = 0
                release_branch_count = 0
                candidate_run_count = 0
                test_result_count = 0
                package_checksum_count = 0
                evidence_location_count = 0
              }
              /^- Candidate commit:/ {
                print "- Candidate commit: " candidate_commit
                candidate_commit_count += 1
                next
              }
              /^- Release branch:/ {
                print "- Release branch: " release_branch
                release_branch_count += 1
                next
              }
              /^- Candidate build run:/ {
                print "- Candidate build run: " candidate_run
                candidate_run_count += 1
                next
              }
              /^- Automated result and test count:/ {
                print "- Automated result and test count: PASS (" test_result ")"
                test_result_count += 1
                next
              }
              /^- Package SHA-256:/ {
                print "- Package SHA-256: " package_checksum
                package_checksum_count += 1
                next
              }
              /^- Evidence location:/ {
                print "- Evidence location: " evidence_location
                evidence_location_count += 1
                next
              }
              { print }
              END {
                if (candidate_commit_count != 1 || release_branch_count != 1 ||
                    candidate_run_count != 1 ||
                    test_result_count != 1 || package_checksum_count != 1 ||
                    evidence_location_count != 1) {
                  exit 42
                }
              }
            ' "$qa_record" > .release/qa-record.md || {
              echo "QA record must contain exactly one of each automated evidence field." >&2
              exit 1
            }

          echo "path=$qa_record" >> "$GITHUB_OUTPUT"
          echo "candidate_commit=${CANDIDATE_COMMIT,,}" >> "$GITHUB_OUTPUT"

      - name: Write candidate metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          PACKAGE_CHECKSUM: ${{ steps.package.outputs.checksum }}
          TEST_RESULT: ${{ steps.package.outputs.test_result }}
          QA_RECORD: ${{ steps.qa_record.outputs.path }}
        run: |
          set -euo pipefail
          jq -n \
            --argjson schemaVersion 3 \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$RELEASE_VERSION" \
            --arg branch "$RELEASE_BRANCH" \
            --arg commit "${CANDIDATE_COMMIT,,}" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg artifactName "$ARTIFACT_NAME" \
            --arg packageSha256 "$PACKAGE_CHECKSUM" \
            --arg testResult "$TEST_RESULT" \
            --arg qaRecordPath "$QA_RECORD" \
            '{
              schemaVersion: $schemaVersion,
              repository: $repository,
              version: $version,
              branch: $branch,
              commit: $commit,
              runId: $runId,
              runAttempt: $runAttempt,
              artifactName: $artifactName,
              packageSha256: $packageSha256,
              testResult: $testResult,
              qaRecordPath: $qaRecordPath
            }' > .release/candidate.json

      - name: Upload canonical candidate artifact
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.version }}-${{ steps.qa_record.outputs.candidate_commit }}-${{ github.run_attempt }}
          path: |
            .release/${{ steps.package.outputs.artifact_name }}
            .release/candidate.json
            .release/qa-record.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Summarize QA evidence
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          CANDIDATE_RUN: ${{ github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_URL: ${{ steps.candidate_artifact.outputs.artifact-url }}
          PACKAGE_CHECKSUM: ${{ steps.package.outputs.checksum }}
          QA_RECORD: ${{ steps.qa_record.outputs.path }}
          TEST_RESULT: ${{ steps.package.outputs.test_result }}
        run: |
          {
            echo "## Canonical release candidate"
            echo
            echo "Download and live-test the ZIP inside this immutable workflow artifact:"
            echo
            echo "- Artifact: $CANDIDATE_ARTIFACT_URL"
            echo "- Candidate commit: \`${CANDIDATE_COMMIT,,}\`"
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Candidate build run: \`$CANDIDATE_RUN\`"
            echo "- Candidate artifact ID: \`$CANDIDATE_ARTIFACT_ID\`"
            echo "- Automated result and test count: \`PASS ($TEST_RESULT)\`"
            echo "- Package SHA-256: \`$PACKAGE_CHECKSUM\`"
            echo "- QA record path: \`$QA_RECORD\`"
            echo
            echo "Use the populated \`qa-record.md\` included in this artifact for live QA."
            echo "Commit it back to \`$QA_RECORD\` after signing off. Do not rebuild or rename the inner ZIP."
          } >> "$GITHUB_STEP_SUMMARY"
