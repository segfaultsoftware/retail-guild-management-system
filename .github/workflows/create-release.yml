name: Create Release
run-name: Create Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 1.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: create-release-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.request.outputs.artifact_name }}
      commit: ${{ steps.request.outputs.commit }}
      is_final: ${{ steps.request.outputs.is_final }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release request and metadata
        id: request
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/release-tools.psm1 -Force

          if ($env:RELEASE_COMMIT -cnotmatch '^[0-9a-fA-F]{40}$') {
            throw 'The workflow dispatch commit must be a full 40-character SHA.'
          }
          if ($env:WORKFLOW_REF_NAME -cne 'main') {
            throw 'Create Release must be dispatched from main.'
          }
          $kind = Get-RgmsReleaseKind $env:RELEASE_VERSION
          $actualCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:RELEASE_COMMIT.ToLowerInvariant()) {
            throw 'Checked-out commit does not match the workflow dispatch commit.'
          }

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh origin/main.' }
          $mainCommit = (git rev-parse 'refs/remotes/origin/main^{commit}').Trim().ToLowerInvariant()
          if ($actualCommit -cne $mainCommit) {
            throw 'The workflow dispatch commit is not the current origin/main commit.'
          }

          $manifestVersion = Get-RgmsManifestField RGMS.toc Version
          if ($manifestVersion -cne $env:RELEASE_VERSION) {
            throw "RGMS.toc version '$manifestVersion' does not match '$($env:RELEASE_VERSION)'."
          }
          $null = Get-RgmsChangelogSection CHANGELOG.md $env:RELEASE_VERSION

          $tag = "v$($env:RELEASE_VERSION)"
          "artifact_name=RGMS-$($env:RELEASE_VERSION).zip" >> $env:GITHUB_OUTPUT
          "commit=$actualCommit" >> $env:GITHUB_OUTPUT
          "is_final=$(if ($kind -eq 'final') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($env:RELEASE_VERSION)" >> $env:GITHUB_OUTPUT

      - name: Validate tag and release availability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

  build_and_test:
    name: Build and test
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.hosted_package.outputs.artifact-id }}
      artifact_name: ${{ steps.package.outputs.hosted_artifact_name }}
      checksum: ${{ steps.package.outputs.checksum }}
      test_result: ${{ steps.package.outputs.test_result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Test release automation
        run: |
          pwsh -NoProfile -File ./Tests/release_workflow_tests.ps1
          bash ./Tests/prepare_release_tests.sh

      - name: Build canonical release package
        id: package
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p .release
          pwsh -NoProfile -File ./scripts/build-release.ps1 \
            -Version "$RELEASE_VERSION" \
            -LuaCommand lua5.1 | tee .release/build.log

          artifact=".release/$ARTIFACT_NAME"
          checksum="$(sha256sum "$artifact" | awk '{ print tolower($1) }')"
          test_result="$(grep -E '^[0-9]+ tests: [0-9]+ passed, 0 failed$' .release/build.log | tail -n 1)"
          [[ -n "$test_result" ]] || {
            echo 'Could not read the passing test count from the release build.' >&2
            exit 1
          }

          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "hosted_artifact_name=release-$RELEASE_VERSION-$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "test_result=$test_result" >> "$GITHUB_OUTPUT"

      - name: Retain release package
        id: hosted_package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.hosted_artifact_name }}
          path: .release/${{ needs.validate.outputs.artifact_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  curseforge_preflight:
    name: CurseForge preflight
    needs: validate
    if: needs.validate.outputs.is_final == 'true'
    runs-on: ubuntu-latest
    outputs:
      game_version_id: ${{ steps.preflight.outputs.game_version_id }}
      retail_game_version: ${{ steps.preflight.outputs.retail_game_version }}
      retail_version: ${{ steps.preflight.outputs.retail_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Resolve Retail game-version ID
        id: preflight
        shell: pwsh
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/release-tools.psm1 -Force
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_TOKEN)) {
            throw 'The CURSEFORGE_API_TOKEN repository Actions secret is required for final releases.'
          }
          $retailVersion = Get-RgmsManifestField RGMS.toc 'X-RGMS-Retail-Version'
          $retailGameVersion = Get-RgmsRetailGameVersion $retailVersion
          $curseProjectId = Get-RgmsManifestField RGMS.toc 'X-Curse-Project-ID'
          if ($curseProjectId -cne '1741733') {
            throw "RGMS.toc X-Curse-Project-ID must be 1741733; found '$curseProjectId'."
          }

          $headers = @{ 'X-Api-Token' = $env:CURSEFORGE_API_TOKEN }
          $gameVersionResponse = Invoke-RestMethod `
            -Uri 'https://wow.curseforge.com/api/game/wow/versions' `
            -Headers $headers
          $gameVersions = @($gameVersionResponse)
          $gameVersionId = Resolve-CurseForgeRetailGameVersion `
            -GameVersions $gameVersions `
            -RetailVersion $retailGameVersion
          "game_version_id=$gameVersionId" >> $env:GITHUB_OUTPUT
          "retail_game_version=$retailGameVersion" >> $env:GITHUB_OUTPUT
          "retail_version=$retailVersion" >> $env:GITHUB_OUTPUT

          @"
          ## CurseForge preflight

          - Project ID: ``1741733``
          - Retail version: ``$retailVersion``
          - Retail game version: ``$retailGameVersion``
          - CurseForge game-version ID: ``$gameVersionId``
          - Credentials: validated by authenticated game-version lookup
          "@ >> $env:GITHUB_STEP_SUMMARY

  publish_github:
    name: Publish GitHub
    needs:
      - validate
      - build_and_test
      - curseforge_preflight
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.build_and_test.result == 'success' &&
      (needs.validate.outputs.is_final != 'true' || needs.curseforge_preflight.result == 'success')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.verify.outputs.release_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download canonical package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_and_test.outputs.artifact_name }}
          path: .release

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PACKAGE_CHECKSUM: ${{ needs.build_and_test.outputs.checksum }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/release-tools.psm1 -Force
          $changelog = Get-RgmsChangelogSection CHANGELOG.md $env:RELEASE_VERSION
          @"
          Built by GitHub from commit ``$($env:RELEASE_COMMIT)``.

          SHA-256: ``$($env:PACKAGE_CHECKSUM)``

          ## Changelog

          $changelog
          "@ | Set-Content -Path .release/release-notes.md -Encoding utf8NoBOM

      - name: Recheck release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          [[ "${main_commit,,}" == "${RELEASE_COMMIT,,}" ]] || {
            echo 'origin/main moved after validation; rerun Create Release for its new tip.' >&2
            exit 1
          }
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag appeared after validation: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release appeared after validation: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "RGMS $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          IS_FINAL: ${{ needs.validate.outputs.is_final }}
        run: |
          set -euo pipefail
          arguments=(
            release create "$RELEASE_TAG"
            ".release/$ARTIFACT_NAME"
            --verify-tag
            --title "RGMS $RELEASE_VERSION"
            --notes-file .release/release-notes.md
          )
          if [[ "$IS_FINAL" == 'true' ]]; then
            arguments+=(--latest)
          else
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"

      - name: Verify published release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          EXPECTED_CHECKSUM: ${{ needs.build_and_test.outputs.checksum }}
          TEST_RESULT: ${{ needs.build_and_test.outputs.test_result }}
          HOSTED_ARTIFACT_ID: ${{ needs.build_and_test.outputs.artifact_id }}
          IS_FINAL: ${{ needs.validate.outputs.is_final }}
        run: |
          set -euo pipefail
          tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          [[ "${tagged_commit,,}" == "${RELEASE_COMMIT,,}" ]] || {
            echo 'Tag does not resolve to the requested release commit.' >&2
            exit 1
          }

          release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,assets,url)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.name' <<<"$release_json")" == "RGMS $RELEASE_VERSION" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == 'false' ]]
          if [[ "$IS_FINAL" == 'true' ]]; then
            [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == 'false' ]]
          else
            [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == 'true' ]]
          fi
          [[ "$(jq --arg name "$ARTIFACT_NAME" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")" -eq 1 ]]

          mkdir -p .release/downloaded
          gh release download "$RELEASE_TAG" --pattern "$ARTIFACT_NAME" --dir .release/downloaded
          downloaded_checksum="$(sha256sum ".release/downloaded/$ARTIFACT_NAME" | awk '{ print tolower($1) }')"
          [[ "$downloaded_checksum" == "$EXPECTED_CHECKSUM" ]] || {
            echo 'Downloaded release asset checksum does not match the built package.' >&2
            exit 1
          }

          release_url="$(jq -r '.url' <<<"$release_json")"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          {
            echo '## Published GitHub release'
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Asset: \`$ARTIFACT_NAME\`"
            echo "- Retained artifact ID: \`$HOSTED_ARTIFACT_ID\`"
            echo "- Automated tests: \`PASS ($TEST_RESULT)\`"
            echo "- SHA-256: \`$EXPECTED_CHECKSUM\`"
            echo "- Release: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"

  publish_curseforge:
    name: Publish CurseForge
    needs:
      - validate
      - build_and_test
      - curseforge_preflight
      - publish_github
    if: needs.validate.outputs.is_final == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download verified GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          EXPECTED_CHECKSUM: ${{ needs.build_and_test.outputs.checksum }}
        run: |
          set -euo pipefail
          mkdir -p .release/github
          gh release download "$RELEASE_TAG" --pattern "$ARTIFACT_NAME" --dir .release/github
          downloaded_checksum="$(sha256sum ".release/github/$ARTIFACT_NAME" | awk '{ print tolower($1) }')"
          [[ "$downloaded_checksum" == "$EXPECTED_CHECKSUM" ]] || {
            echo 'GitHub release asset checksum changed before the CurseForge upload.' >&2
            exit 1
          }

      - name: Upload exact GitHub asset to CurseForge
        shell: pwsh
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
          EXPECTED_CHECKSUM: ${{ needs.build_and_test.outputs.checksum }}
          RETAIL_VERSION: ${{ needs.curseforge_preflight.outputs.retail_version }}
          RETAIL_GAME_VERSION: ${{ needs.curseforge_preflight.outputs.retail_game_version }}
          GAME_VERSION_ID: ${{ needs.curseforge_preflight.outputs.game_version_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/release-tools.psm1 -Force
          $displayName = "RGMS $($env:RELEASE_VERSION)"
          $guidance = Get-CurseForgeUploadFailureGuidance
          try {
            $changelog = Get-RgmsChangelogSection CHANGELOG.md $env:RELEASE_VERSION
            $metadata = New-CurseForgeReleaseMetadata `
              -ReleaseVersion $env:RELEASE_VERSION `
              -Changelog $changelog `
              -GameVersionId ([long]$env:GAME_VERSION_ID)
            $metadataJson = $metadata | ConvertTo-Json -Depth 8 -Compress
            $headers = @{ 'X-Api-Token' = $env:CURSEFORGE_API_TOKEN }
            $form = @{
              metadata = $metadataJson
              file = Get-Item -LiteralPath ".release/github/$($env:ARTIFACT_NAME)"
            }
            $response = Invoke-WebRequest `
              -Uri 'https://wow.curseforge.com/api/projects/1741733/upload-file' `
              -Method Post `
              -Headers $headers `
              -Form $form `
              -TimeoutSec 300 `
              -SkipHttpErrorCheck
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
              $apiError = Get-CurseForgeApiErrorMessage $response.Content
              throw "CurseForge returned HTTP $($response.StatusCode). $apiError"
            }
            $fileId = Get-CurseForgeUploadedFileId $response.Content
          } catch {
            $failureReason = $_.Exception.Message
            throw "CurseForge upload failed: $failureReason $guidance"
          }

          $fileUrl = "https://www.curseforge.com/wow/addons/retailguildmanagementsystem/files/$fileId"
          @"
          ## Published CurseForge file

          - File ID: ``$fileId``
          - File: $fileUrl
          - Uploaded filename: ``$($env:ARTIFACT_NAME)``
          - Display name: ``$displayName``
          - Retail version: ``$($env:RETAIL_VERSION)``
          - Retail game-version ID: ``$($env:GAME_VERSION_ID)``
          - SHA-256: ``$($env:EXPECTED_CHECKSUM)``
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Explain CurseForge retry after failure
        if: failure()
        shell: pwsh
        run: |
          @'
          ## CurseForge publication failed

          The verified GitHub tag, release, and ZIP remain intact. Use **Re-run failed jobs** to retry only the CurseForge job. If the upload request timed out or its outcome is unclear, first check the CurseForge **Files** dashboard for the same `RGMS X.Y.Z` display name. The author Upload API does not document an idempotency key or a safe duplicate-upload check.
          '@ >> $env:GITHUB_STEP_SUMMARY
