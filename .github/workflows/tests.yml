name: Tests

on:
  push:
    branches:
      - main
      - release/*
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Run test suite
        run: lua5.1 Tests/run.lua
      - name: Build and validate a reproducible package
        shell: pwsh
        run: |
          $manifestVersion = Select-String `
            -Path RGMS.toc `
            -Pattern '^## Version:\s*(\S+)\s*$'
          if ($manifestVersion.Matches.Count -ne 1) {
            throw "RGMS.toc must declare exactly one Version value."
          }
          ./scripts/build-release.ps1 `
            -Version $manifestVersion.Matches[0].Groups[1].Value `
            -OutputDirectory .release/ci `
            -LuaCommand lua5.1
