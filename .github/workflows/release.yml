name: Release

on:
  workflow_dispatch:
    inputs:
      qa_commit:
        description: Full 40-character QA commit SHA already merged into main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.qa_commit }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.request.outputs.artifact_name }}
      candidate_artifact_id: ${{ steps.request.outputs.candidate_artifact_id }}
      candidate_commit: ${{ steps.request.outputs.candidate_commit }}
      candidate_run: ${{ steps.request.outputs.candidate_run }}
      candidate_run_attempt: ${{ steps.request.outputs.candidate_run_attempt }}
      checksum: ${{ steps.request.outputs.checksum }}
      qa_record: ${{ steps.request.outputs.qa_record }}
      release_commit: ${{ steps.request.outputs.release_commit }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.qa_commit }}

      - name: Validate requested release and QA provenance
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.qa_commit }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'
          commit_pattern='^[0-9a-fA-F]{40}$'
          qa_pattern='^docs/qa/[A-Za-z0-9._-]+\.md$'

          [[ "$RELEASE_COMMIT" =~ $commit_pattern ]] || {
            echo "Commit must be a full 40-character SHA." >&2
            exit 1
          }
          [[ "$WORKFLOW_REF_NAME" == "main" ]] || {
            echo "The Release workflow must be dispatched from main." >&2
            exit 1
          }

          actual_commit="$(git rev-parse HEAD)"
          [[ "${actual_commit,,}" == "${RELEASE_COMMIT,,}" ]] || {
            echo "Checked-out commit does not match the requested QA commit." >&2
            exit 1
          }

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$actual_commit" origin/main || {
            echo "Requested QA commit is not contained in origin/main." >&2
            exit 1
          }

          parent_commit="$(git rev-parse "$actual_commit^1" 2>/dev/null)" || {
            echo "The requested QA commit must have a parent commit." >&2
            exit 1
          }
          mapfile -t qa_commit_paths < <(git diff --name-only "$parent_commit" "$actual_commit")
          [[ "${#qa_commit_paths[@]}" -eq 1 ]] || {
            echo "The QA commit must change exactly one file; found ${#qa_commit_paths[@]}." >&2
            exit 1
          }
          QA_RECORD="${qa_commit_paths[0]}"
          [[ "$QA_RECORD" =~ $qa_pattern && -f "$QA_RECORD" ]] || {
            echo "The QA commit must change exactly one Markdown record directly under docs/qa." >&2
            exit 1
          }

          RELEASE_VERSION="$(sed -n 's/^- Release candidate:[[:space:]]*\([^[:space:]]\+\)[[:space:]]*$/\1/p' "$QA_RECORD")"
          [[ "$RELEASE_VERSION" =~ $version_pattern ]] || {
            echo "QA record does not contain exactly one valid release version." >&2
            exit 1
          }
          [[ "$(grep -Ec '^- Release candidate:' "$QA_RECORD")" -eq 1 ]] || {
            echo "QA record must contain exactly one Release candidate field." >&2
            exit 1
          }

          manifest_version="$(sed -n 's/^## Version:[[:space:]]*\([^[:space:]]\+\)[[:space:]]*$/\1/p' RGMS.toc)"
          [[ "$manifest_version" == "$RELEASE_VERSION" ]] || {
            echo "RGMS.toc version '$manifest_version' does not match '$RELEASE_VERSION'." >&2
            exit 1
          }

          qa_username="$(sed -n 's/^- QA GitHub username:[[:space:]]*\(@[^[:space:]]\+\)[[:space:]]*$/\1/p' "$QA_RECORD")"
          qa_date="$(sed -n 's/^- QA date (Pacific):[[:space:]]*\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)[[:space:]]*$/\1/p' "$QA_RECORD")"
          qa_result="$(sed -n 's/^- Result:[[:space:]]*\(PASS\|FAIL\)[[:space:]]*$/\1/p' "$QA_RECORD")"

          [[ "$(grep -Fxc -- '## QA signoff' "$QA_RECORD")" -eq 1 &&
             "$(grep -Ec '^- QA GitHub username:' "$QA_RECORD")" -eq 1 &&
             "$(grep -Ec '^- QA date \(Pacific\):' "$QA_RECORD")" -eq 1 &&
             "$(grep -Ec '^- Result:' "$QA_RECORD")" -eq 1 ]] || {
            echo "QA record must contain exactly one complete QA signoff block." >&2
            exit 1
          }
          [[ "$qa_username" =~ ^@[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ &&
             "$qa_username" != *--* ]] || {
            echo "QA signoff must contain a valid GitHub username prefixed with @." >&2
            exit 1
          }
          normalized_qa_date="$(date -u -d "$qa_date" +%F 2>/dev/null || true)"
          [[ "$normalized_qa_date" == "$qa_date" ]] || {
            echo "QA signoff date must be a valid date in YYYY-MM-DD format." >&2
            exit 1
          }
          [[ "$qa_result" =~ ^(PASS|FAIL)$ ]] || {
            echo "QA signoff result must be PASS or FAIL." >&2
            exit 1
          }
          if [[ "$qa_result" != "PASS" ]]; then
            echo "QA signed off with $qa_result; release promotion requires PASS." >&2
            exit 1
          fi

          candidate_commit="$(sed -n 's/^- Candidate commit:[[:space:]]*\([0-9a-fA-F]\{40\}\)[[:space:]]*$/\1/p' "$QA_RECORD" | tr '[:upper:]' '[:lower:]')"
          candidate_run="$(sed -n 's/^- Candidate build run:[[:space:]]*\([0-9]\+\)[[:space:]]*$/\1/p' "$QA_RECORD")"
          recorded_checksum="$(sed -n 's/^- Package SHA-256:[[:space:]]*\([0-9a-fA-F]\{64\}\)[[:space:]]*$/\1/p' "$QA_RECORD" | tr '[:upper:]' '[:lower:]')"

          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "QA record does not contain exactly one valid Candidate commit." >&2
            exit 1
          }
          [[ "$candidate_run" =~ ^[1-9][0-9]*$ ]] || {
            echo "QA record does not contain exactly one valid Candidate build run." >&2
            exit 1
          }
          [[ "$recorded_checksum" =~ ^[0-9a-f]{64}$ ]] || {
            echo "QA record does not contain exactly one valid Package SHA-256." >&2
            exit 1
          }
          [[ "$(grep -Ec '^- Candidate commit:' "$QA_RECORD")" -eq 1 ]]
          [[ "$(grep -Ec '^- Candidate build run:' "$QA_RECORD")" -eq 1 ]]
          [[ "$(grep -Ec '^- Package SHA-256:' "$QA_RECORD")" -eq 1 ]]

          git cat-file -e "$candidate_commit^{commit}" 2>/dev/null || {
            echo "Candidate commit is unavailable from the QA commit history." >&2
            exit 1
          }
          git merge-base --is-ancestor "$candidate_commit" "$actual_commit" || {
            echo "Candidate commit is not an ancestor of the QA commit." >&2
            exit 1
          }
          git merge-base --is-ancestor "$candidate_commit" origin/main || {
            echo "Candidate commit is not contained in origin/main." >&2
            exit 1
          }

          mapfile -t changed_paths < <(git diff --name-only "$candidate_commit" "$actual_commit")
          [[ "${#changed_paths[@]}" -eq 1 && "${changed_paths[0]}" == "$QA_RECORD" ]] || {
            echo "Only the inferred QA record may change after the candidate build." >&2
            exit 1
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run")"
          jq -e \
            --arg commit "$candidate_commit" \
            '.event == "workflow_dispatch" and
             .status == "completed" and
             .conclusion == "success" and
             .path == ".github/workflows/build-release-candidate.yml" and
             ((.head_sha | ascii_downcase) == $commit)' \
            <<<"$run_json" >/dev/null || {
              echo "Candidate build run is not a successful Build Release Candidate run for the recorded commit." >&2
              exit 1
            }

          candidate_run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_json")"
          [[ "$candidate_run_attempt" =~ ^[1-9][0-9]*$ ]] || {
            echo "Candidate build run does not contain a valid run attempt." >&2
            exit 1
          }
          expected_artifact_name="release-candidate-$RELEASE_VERSION-$candidate_commit-$candidate_run_attempt"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/artifacts?per_page=100")"
          candidate_artifact_id="$(
            jq -r \
              --arg name "$expected_artifact_name" \
              --argjson run_id "$candidate_run" \
              '[.artifacts[] |
                select(.name == $name and .expired == false and .workflow_run.id == $run_id)] |
               if length == 1 then .[0].id else empty end' \
              <<<"$artifacts_json"
          )"
          [[ "$candidate_artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "Candidate run must have exactly one unexpired artifact named $expected_artifact_name." >&2
            exit 1
          }

          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi

          echo "artifact_name=RGMS-$RELEASE_VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_id=$candidate_artifact_id" >> "$GITHUB_OUTPUT"
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_run=$candidate_run" >> "$GITHUB_OUTPUT"
          echo "candidate_run_attempt=$candidate_run_attempt" >> "$GITHUB_OUTPUT"
          echo "checksum=$recorded_checksum" >> "$GITHUB_OUTPUT"
          echo "qa_record=$QA_RECORD" >> "$GITHUB_OUTPUT"
          echo "release_commit=${actual_commit,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download canonical candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.request.outputs.candidate_artifact_id }}
          path: .release/candidate
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.candidate_run }}

      - name: Verify canonical candidate artifact
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
          CANDIDATE_COMMIT: ${{ steps.request.outputs.candidate_commit }}
          CANDIDATE_RUN: ${{ steps.request.outputs.candidate_run }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.request.outputs.candidate_run_attempt }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
          EXPECTED_CHECKSUM: ${{ steps.request.outputs.checksum }}
          QA_RECORD: ${{ steps.request.outputs.qa_record }}
        run: |
          set -euo pipefail
          package=".release/candidate/$ARTIFACT_NAME"
          metadata=".release/candidate/candidate.json"
          populated_qa_record=".release/candidate/qa-record.md"
          [[ -f "$package" && -f "$metadata" && -f "$populated_qa_record" ]] || {
            echo "Candidate artifact does not contain the expected package, metadata, and populated QA record." >&2
            exit 1
          }

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$CANDIDATE_COMMIT" \
            --argjson run_id "$CANDIDATE_RUN" \
            --argjson run_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg checksum "$EXPECTED_CHECKSUM" \
            --arg qa_record "$QA_RECORD" \
            '.schemaVersion == 2 and
             .repository == $repository and
             .version == $version and
             .commit == $commit and
             .runId == $run_id and
             .runAttempt == $run_attempt and
             .artifactName == $artifact_name and
             .packageSha256 == $checksum and
             .qaRecordPath == $qa_record' \
            "$metadata" >/dev/null || {
              echo "Candidate metadata does not match the QA record and release request." >&2
              exit 1
            }

          actual_checksum="$(sha256sum "$package" | awk '{ print tolower($1) }')"
          [[ "$actual_checksum" == "$EXPECTED_CHECKSUM" ]] || {
            echo "Downloaded candidate package does not match the live-tested checksum." >&2
            echo "QA record: $EXPECTED_CHECKSUM" >&2
            echo "Downloaded: $actual_checksum" >&2
            exit 1
          }

  promote:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.release_commit }}

      - name: Require configured release approvers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewer_count="$(
            gh api "repos/$GITHUB_REPOSITORY/environments/release" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'
          )"
          [[ "$reviewer_count" =~ ^[1-9][0-9]*$ ]] || {
            echo "The release environment has no required reviewers configured." >&2
            echo "Configure at least one required reviewer before promoting a release." >&2
            exit 1
          }

      - name: Download approved canonical candidate
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.preflight.outputs.candidate_artifact_id }}
          path: .release/candidate
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.candidate_run }}

      - name: Reverify approved candidate checksum
        env:
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          EXPECTED_CHECKSUM: ${{ needs.preflight.outputs.checksum }}
        run: |
          set -euo pipefail
          actual_checksum="$(sha256sum ".release/candidate/$ARTIFACT_NAME" | awk '{ print tolower($1) }')"
          [[ "$actual_checksum" == "$EXPECTED_CHECKSUM" ]] || {
            echo "Approved candidate checksum changed after preflight." >&2
            exit 1
          }

      - name: Recheck version availability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag appeared after preflight: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release appeared after preflight: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          CANDIDATE_COMMIT: ${{ needs.preflight.outputs.candidate_commit }}
          CANDIDATE_RUN: ${{ needs.preflight.outputs.candidate_run }}
          QA_RECORD: ${{ needs.preflight.outputs.qa_record }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
          PACKAGE_CHECKSUM: ${{ needs.preflight.outputs.checksum }}
        run: |
          $version = $env:RELEASE_VERSION
          $changelog = Get-Content -Raw CHANGELOG.md
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match(
            $changelog,
            "(?ms)^## (?:\[${escapedVersion}\]|${escapedVersion})(?:[ \t]+[^\r\n]*)?\r?\n(.*?)(?=^## |\z)"
          )
          if (-not $match.Success -and $version.Contains("-")) {
            $match = [regex]::Match(
              $changelog,
              '(?ms)^## (?:\[Unreleased\]|Unreleased)(?:[ \t]+[^\r\n]*)?\r?\n(.*?)(?=^## |\z)'
            )
          }
          if (-not $match.Success) {
            throw "CHANGELOG.md has no section for $version."
          }

          $notes = @"
          Built by GitHub from candidate commit ``$($env:CANDIDATE_COMMIT)`` and live-tested without rebuilding.

          QA commit: ``$($env:RELEASE_COMMIT)``

          Candidate build run: ``$($env:CANDIDATE_RUN)``

          SHA-256: ``$($env:PACKAGE_CHECKSUM)``

          QA record: ``$($env:QA_RECORD)``

          ## Changelog

          $($match.Groups[1].Value.Trim())
          "@
          New-Item -ItemType Directory -Path .release -Force | Out-Null
          Set-Content -Path .release/release-notes.md -Value $notes -Encoding utf8NoBOM

      - name: Create and push the approved tag
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "RGMS $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
        run: |
          set -euo pipefail
          arguments=(
            release create "$RELEASE_TAG"
            ".release/candidate/$ARTIFACT_NAME"
            --verify-tag
            --draft
            --title "RGMS $RELEASE_VERSION"
            --notes-file .release/release-notes.md
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"

      - name: Verify the tag, draft, and downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
          CANDIDATE_COMMIT: ${{ needs.preflight.outputs.candidate_commit }}
          CANDIDATE_RUN: ${{ needs.preflight.outputs.candidate_run }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.preflight.outputs.candidate_artifact_id }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          EXPECTED_CHECKSUM: ${{ needs.preflight.outputs.checksum }}
        run: |
          set -euo pipefail

          tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          [[ "${tagged_commit,,}" == "${RELEASE_COMMIT,,}" ]] || {
            echo "Tag does not resolve to the approved QA commit." >&2
            exit 1
          }

          release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,assets,url)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.name' <<<"$release_json")" == "RGMS $RELEASE_VERSION" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == "true" ]]
          else
            [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == "false" ]]
          fi
          [[ "$(jq --arg name "$ARTIFACT_NAME" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")" -eq 1 ]]

          mkdir -p .release/downloaded
          gh release download "$RELEASE_TAG" \
            --pattern "$ARTIFACT_NAME" \
            --dir .release/downloaded
          downloaded_checksum="$(sha256sum ".release/downloaded/$ARTIFACT_NAME" | awk '{ print tolower($1) }')"
          [[ "$downloaded_checksum" == "$EXPECTED_CHECKSUM" ]] || {
            echo "Downloaded release asset checksum does not match the approved candidate." >&2
            exit 1
          }

          release_url="$(jq -r '.url' <<<"$release_json")"
          {
            echo "## Verified draft release"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- QA commit: \`$RELEASE_COMMIT\`"
            echo "- Candidate commit: \`$CANDIDATE_COMMIT\`"
            echo "- Candidate build run: \`$CANDIDATE_RUN\`"
            echo "- Candidate artifact ID: \`$CANDIDATE_ARTIFACT_ID\`"
            echo "- Asset: \`$ARTIFACT_NAME\`"
            echo "- SHA-256: \`$EXPECTED_CHECKSUM\`"
            echo "- Draft: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"
